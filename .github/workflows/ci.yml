name: cwformer CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cwformer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test model code and verify published data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU test and export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,export]"

      - name: Run Python tests
        run: python -m pytest

      - name: Verify deterministic dataset hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path("datasets/qso-semantics-v4")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          failures = []
          for entry in manifest["files"]:
              path = root / entry["file"]
              actual_size = path.stat().st_size
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_size != entry["bytes"] or actual_hash != entry["sha256"]:
                  failures.append(
                      f"{entry['file']}: size={actual_size}, sha256={actual_hash}"
                  )
          if failures:
              raise SystemExit("Dataset integrity failure:\n" + "\n".join(failures))
          print(f"Verified {len(manifest['files'])} deterministic dataset archives.")

      - name: Verify release model hashes and ONNX graphs
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          import onnx
          import onnxruntime as ort

          release = Path("releases/semantic-v0.4")
          contract_path = release / "qso-semanticformer-v0.4.release.fp32.runtime-contract.json"
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          if contract["contractVersion"] != "qso-semantic-runtime-4":
              raise SystemExit(f"Unexpected contract: {contract['contractVersion']}")
          for entry in contract["artifacts"]:
              path = release / entry["file"]
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != entry["sha256"]:
                  raise SystemExit(f"Release hash mismatch for {path}: {actual}")
              onnx.checker.check_model(onnx.load(path))
              providers = ort.InferenceSession(path, providers=["CPUExecutionProvider"]).get_providers()
              if "CPUExecutionProvider" not in providers:
                  raise SystemExit(f"CPU provider unavailable for {path}: {providers}")
              print(f"Verified {path.name}: {actual}")
